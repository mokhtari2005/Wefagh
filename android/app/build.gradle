plugins { id 'com.android.application' }

android {
    namespace 'ir.mokhtari.academy'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.mokhtari.academy'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv('ANDROID_KEYSTORE_PATH')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}
