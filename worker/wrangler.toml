name = "wefagh"
main = "src/index.js"
compatibility_date = "2026-01-01"


routes = [
  { pattern = "mokhtari.ir/api/*", zone_name = "mokhtari.ir" }
]

[[d1_databases]]
binding = "DB"
database_name = "wefagh-db"
database_id = "a02aeb28-b6e7-4423-9671-1ce3f9e3038b"
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *", "30 1 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
GEMINI_TEXT_MODEL = "gemini-3.5-flash-lite"
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
BASE_URL = "https://mokhtari.ir"
