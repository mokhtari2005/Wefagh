name = "wefagh"
main = "src/index.js"
compatibility_date = "2026-01-01"

routes = [
  { pattern = "mokhtari.ir/api/*", zone_name = "mokhtari.ir" }
]

[[d1_databases]]
binding = "DB"
database_name = "wefagh-db"
database_id = "a02aeb28-b6e7-4423-9671-1ce3f9e3038b"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
GEMINI_TEXT_MODEL = "gemini-2.5-flash"
GEMINI_TTS_MODEL = "gemini-3.8-flash-tts"
BASE_URL = "https://mokhtari.ir"
