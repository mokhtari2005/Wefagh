name = "wefagh"
main = "src/index.js"
compatibility_date = "2026-01-01"

[ai]
binding = "AI"


routes = [
  { pattern = "mokhtari.ir/api/*", zone_name = "mokhtari.ir" }
]


[[d1_databases]]
binding = "DB"
database_name = "wefagh-db"
database_id = "a02aeb28-b6e7-4423-9671-1ce3f9e3038b"
migrations_dir = "migrations"

[triggers]
crons = ["*/30 * * * *", "*/5 * * * *", "30 1 * * *", "0 */6 * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
# Fail-closed: do not call billable providers. Workers AI requires a separate explicit flag.
AI_BILLING_MODE = "zero"
WORKERS_AI_PRIMARY_ENABLED = "false"
WORKERS_AI_REVIEW_ENABLED = "false"
OPENAI_TEXT_MODEL = "gpt-6.2-astra"
OPENAI_REASONING_EFFORT = "medium"
GEMINI_TEXT_MODEL = "gemini-3.5-flash-lite"
GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
BASE_URL = "https://mokhtari.ir"
B2_BUCKET = "wefagh-classroom-recordings"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
