name: Import public Iranian legal corpus

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/import_ekhtebar_corpus.py'
      - 'scripts/legal_priority_documents.json'
      - '.github/workflows/import-legal-corpus.yml'
  schedule:
    # Daily source refresh and change detection; changed existing documents are queued for review.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: Type IMPORT_TO_D1 to import public corpus documents as needs_review
        required: true
        type: string
      phase:
        description: Select the legal document family to import
        required: true
        default: all
        type: choice
        options:
          - laws
          - regulations
          - judicial
          - parliamentary
          - all

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.confirm == 'IMPORT_TO_D1'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm install --global wrangler
          python -m pip install --upgrade pip requests
      - name: Normalize and verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

          clean_token="$(python - <<'PY'
          import os
          import sys

          token = "".join(os.environ["CLOUDFLARE_API_TOKEN"].split())
          if not token:
              sys.exit("Cloudflare API token is empty after whitespace normalization")
          print(token)
          PY
          )"

          echo "::add-mask::$clean_token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$clean_token" >> "$GITHUB_ENV"

          verify_response="$(curl --silent --show-error --retry 2 \
            --header "Authorization: Bearer $clean_token" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"

          printf '%s' "$verify_response" | python -c '
          import json
          import sys

          try:
              payload = json.load(sys.stdin)
          except Exception:
              sys.exit("Cloudflare token verification returned an unreadable response")
          if payload.get("success") and (payload.get("result") or {}).get("status") == "active":
              print("Cloudflare API token verified and active.")
              raise SystemExit(0)
          errors = payload.get("errors") or []
          messages = "; ".join(str(item.get("message", "Unknown Cloudflare API error")) for item in errors)
          sys.exit("Cloudflare API token verification failed" + (": " + messages if messages else ""))
          '
      - name: Apply pending D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply wefagh-db --remote --config wrangler.toml
      - name: Import corpus into D1
        env:
          LEGAL_IMPORT_PHASE: ${{ inputs.phase || 'all' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/import_ekhtebar_corpus.py
      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-bank-import-report
          path: artifacts/legal-bank-import-report.json
          if-no-files-found: ignore
          retention-days: 30
