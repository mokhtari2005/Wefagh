name: Extract Wefagh Project
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check ZIP file
        run: |
          ls -la
          test -f wefagh-v0.1.0.zip
      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -o wefagh-v0.1.0.zip -d extracted
          echo "Extracted ZIP contents:"
          find extracted -maxdepth 3 -type d
          if [ -d extracted/wefagh ]; then
            cp -R extracted/wefagh/. .
          else
            echo "Expected folder extracted/wefagh was not found."
            exit 1
          fi
          rm -rf extracted
      - name: Verify site folder
        run: |
          test -d site
          ls -la site
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract Wefagh project files"
            git push
          fi
