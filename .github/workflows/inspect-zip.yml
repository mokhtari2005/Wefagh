name: Extract Wefagh Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o wefagh-v0.1.0.zip -d extracted
          cp -R extracted/wefagh/. .
          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site worker docs tests README.md package.json راهنمای-شروع.md
          git commit -m "Extract Wefagh project files" || echo "No changes to commit"
          git push
