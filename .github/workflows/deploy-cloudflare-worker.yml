name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending remote D1 migrations before deployment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Sanitize and prepare Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, unicodedata

          def report(name, raw, allowed):
              clean = "".join(ch for ch in raw if re.fullmatch(allowed, ch))
              removed = [ch for ch in raw if not re.fullmatch(allowed, ch)]
              cats = {}
              for ch in removed:
                  key = unicodedata.category(ch)
                  cats[key] = cats.get(key, 0) + 1
              print(f"{name}: raw_length={len(raw)} lines={raw.count(chr(10)) + 1} "
                    f"non_ascii={sum(1 for ch in raw if ord(ch) > 127)} removed={len(removed)} "
                    f"removed_by_unicode_category={cats} clean_length={len(clean)}")
              return clean

          token = report("CLOUDFLARE_API_TOKEN", os.environ.get("RAW_CLOUDFLARE_API_TOKEN", ""), r"[A-Za-z0-9_\-]")
          account = report("CLOUDFLARE_ACCOUNT_ID", os.environ.get("RAW_CLOUDFLARE_ACCOUNT_ID", ""), r"[0-9A-Fa-f]")
          if not token or not account:
              sys.exit("Credential is empty after sanitizing")
          if len(account) != 32:
              sys.exit(f"Invalid account ID length: {len(account)} (expected 32)")
          if len(token) != 40:
              print(f"WARNING: token clean_length={len(token)} (Cloudflare API tokens are normally 40 characters)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"CLOUDFLARE_API_TOKEN={token}\nCLOUDFLARE_ACCOUNT_ID={account}\n")
          print(f"::add-mask::{token}")
          print(f"::add-mask::{account}")
          PY

      # GITHUB_ENV values become available only to subsequent steps.
      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --retry 2 --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/user/tokens/verify")"
          printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") and (d.get("result") or {}).get("status")=="active" else 1)' || {
            echo "Cloudflare token could not be verified as active"
            exit 1
          }
          echo "Cloudflare token verified and active"

      - name: Apply pending remote D1 migrations
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations == true) }}
        working-directory: worker
        run: wrangler d1 migrations apply wefagh-db --remote --config wrangler.toml

      - name: Verify password recovery D1 schema
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute wefagh-db --remote --config wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','email_tokens') ORDER BY name;"
          wrangler d1 execute wefagh-db --remote --config wrangler.toml --command "SELECT id, status, email_verified_at FROM users LIMIT 0;"
          wrangler d1 execute wefagh-db --remote --config wrangler.toml --command "SELECT user_id, purpose, created_at, used_at, token_hash, expires_at FROM email_tokens LIMIT 0;"

      - name: Deploy Worker
        working-directory: worker
        run: wrangler deploy --config wrangler.toml
