name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_CONFIGURED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK for installation testing
        working-directory: android
        run: gradle assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: mokhtari-law-academy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Decode permanent release signing key
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/academy-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/academy-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: gradle assembleRelease
      - name: Publish public APK release
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: آکادمی وکالت اندروید 1.0.0
          body: نسخهٔ رسمی اندروید آکادمی وکالت شهرام مختاری
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
