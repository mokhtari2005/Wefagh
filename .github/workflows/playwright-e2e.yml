name: Playwright browser tests

on:
  push:
    branches:
      - chore/install-playwright-e2e
      - test/assistant-consultation-flow
      - feat/tehran-regional-property-value-1405
    paths:
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-e2e.yml'
  pull_request:
    paths:
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/playwright-e2e.yml'
  workflow_dispatch:
    inputs:
      run_live_ai:
        description: 'اجرای یک درخواست واقعی به مدل (ممکن است اعتبار API مصرف کند)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local site for branch-specific interaction tests
        run: |
          python3 -m http.server 8080 --directory site > /tmp/wefagh-site.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null

      - name: Verify lightweight assistant menu and homepage critical assets
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test e2e/startup-performance.spec.js

      - name: Verify homepage academy shortcuts on desktop and mobile
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test e2e/home-academy.spec.js

      - name: Verify academy case studies on desktop and mobile
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test e2e/academy-case-studies.spec.js

      - name: Run consultation interaction tests against this branch
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
          RUN_LIVE_AI_E2E: '0'
        run: npx playwright test e2e/assistant-consultation.spec.js

      - name: Run Tehran and city-specific regional calculator tests against this branch
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test e2e/regional-value.spec.js

      - name: Run public-site smoke tests against production
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://mokhtari.ir
        run: npx playwright test e2e/site-smoke.spec.js

      - name: Measure real page readiness and resource timings on production
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://mokhtari.ir
        run: npx playwright test e2e/site-performance.spec.js

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
