name: Check Dadras public legal MCP

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_dadras_mcp.py'
      - '.github/workflows/probe-dadras-mcp.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Check public read-only MCP
        run: python scripts/probe_dadras_mcp.py
      - name: Upload MCP probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dadras-mcp-probe-report
          path: artifacts/dadras-mcp-probe.json
          if-no-files-found: ignore
          retention-days: 30
