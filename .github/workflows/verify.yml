name: Verify

on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run crawler and parser unit tests
        run: |
          python -m pip install requests
          python -m unittest tests.test_national_judgment_parser tests.test_national_judgment_crawler
      - name: Run syntax checks and tests
        run: npm run verify
