name: Verify

on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']

jobs:
  legal-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install parser dependency
        run: python -m pip install requests
      - name: Verify legal importer syntax and focused tests
        run: |
          python -m py_compile scripts/import_ekhtebar_corpus.py scripts/import_iran_graphrag_corpus.py scripts/probe_qavanin_public.py scripts/probe_dadras_mcp.py scripts/crawl_national_judgments.py scripts/parse_national_judgment.py
          python -m unittest discover -s tests -p 'test_legal_corpus_importer.py'
          python -m unittest discover -s tests -p 'test_iran_graphrag_importer.py'
          python -m unittest discover -s tests -p 'test_national_judgment_crawler.py'
          python -m unittest discover -s tests -p 'test_national_judgment_parser.py'
          node --test tests/legal-source-registry.test.js
  judicial-authorities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify judicial authority retrieval and review independently
        run: node --test tests/judicial-authorities.test.js
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete repository verification
        run: npm run verify
